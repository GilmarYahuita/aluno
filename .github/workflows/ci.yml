name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t portfolio .

      - name: Start container
        run: docker run -d --name portfolio-test -e PORT=8080 -p 8080:8080 portfolio

      - name: Wait for Nginx to be ready
        run: sleep 5

      - name: Test /health endpoint
        run: curl -f http://localhost:8080/health

      - name: Test root page
        run: curl -f http://localhost:8080/

      - name: Stop container
        if: always()
        run: docker rm -f portfolio-test
